<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rich Cobalt Indigo Background -->
  <rect width="512" height="512" rx="112" fill="#1C2C78" />

  <!-- Minimalist Academic Speech Emblem -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Circular Speech Bubble Body -->
    <!-- Center (256, 320), Radius ~96 -->
    <!-- Arc from under cap around to tail -->
    <path
      d="M172 245 C 130 280, 130 355, 175 395 C 220 435, 292 435, 332 395 L 372 425 L 360 375 C 385 348, 388 305, 368 272"
      stroke-width="32"
    />

    <!-- Graduation Mortarboard Top (Rhombus) -->
    <polygon
      points="256,92 428,168 256,244 84,168"
      stroke-width="32"
      fill="#1C2C78"
    />

    <!-- Under-Cap Band -->
    <path
      d="M170 206 V240 C170 274, 342 274, 342 240 V206"
      stroke-width="26"
    />

    <!-- Tassel Cord and Drop (Golden Amber Accent) -->
    <path
      d="M400 180 V245"
      stroke="#F59E0B"
      stroke-width="14"
    />
  </g>
  <!-- Tassel Finial & Bell -->
  <circle cx="400" cy="254" r="10" fill="#F59E0B" />
</svg>
