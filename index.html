  <script id="config-init">
    (function() {
      try {
        if (window.location.pathname === '/twa') {
          window.location.replace('/ielts');
        }
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
        const theme = localStorage.getItem('study_planner_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
        const lang = localStorage.getItem('study_planner_lang');
        const urlLang = new URLSearchParams(window.location.search).get('lang');
        if (urlLang === 'uz' || urlLang === 'en') {
          document.documentElement.lang = urlLang;
        } else if (lang) {
          document.documentElement.lang = lang;
        }
      } catch (e) {}
    })();
  </script>
